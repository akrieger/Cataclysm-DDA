name: Add new contributor label to PR

on:
  workflow_run:
    workflows: ["Sort new contributors for test approval"]
    types:
      - completed

# Needed for `gh` cli
env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - name: Download artifact
        id: pr-check
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            var artifacts = await github.actions.listWorkflowRunArtifacts({
               owner: context.repo.owner,
               repo: context.repo.repo,
               run_id: ${{ github.event.workflow_run.id }},
            });
            var matchArtifact = artifacts.data.artifacts.filter((artifact) => {
              return artifact.name == "pr"
            })[0];
            var download = await github.actions.downloadArtifact({
               owner: context.repo.owner,
               repo: context.repo.repo,
               artifact_id: matchArtifact.id,
               archive_format: 'zip',
            });
            var fs = require('fs');
            var pr_buffer = Buffer.from(download.data);
            core.setOutput('pr_number', pr_buffer.size() == 0 ? '0' : pr_buffer)
      - run: unzip pr.zip
      - name: Label contributors with no merged PRs
        if: steps.pr-check.outputs.pr_number == 0
        run: |
          gh pr edit ${{ steps.pr-check.outputs.pr_number }} --add-label "new contributor"
