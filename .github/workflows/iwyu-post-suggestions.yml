name: IWYU post suggestions

on:
  workflow_run:
    workflows: ["IWYU (include-what-you-use)"]
    types: [completed]

jobs:
  iwyu-suggest:
    if: ${{ github.event.workflow_run.head_branch != 'master' && github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout repository
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      with:
        persist-credentials: false
    - name: Download artifact
      id: download-artifact
      uses: dawidd6/action-download-artifact@8305c0f1062bb0d184d09ef4493ecb9288447732 # v20
      with:
        workflow: ${{ github.event.workflow_run.name }}
        run_id: ${{ github.event.workflow_run.id }}
        name: suggestions
        use_unzip: true
    - name: Post IWYU fixes as comments.
      if: ${{ steps.download-artifact.outputs.found_artifact == 'true' }}
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        pip install PyGithub
        export PR_NUMBER=`cat pr_number`
        export COMMIT_SHA=`cat commit_sha`
        python build-scripts/post-diff-as-comments.py IWYU
